<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    </head>
    <body>
        <div class="w-screen h-screen bg-pink-300 grid grid-rows-[20vh_70vh_10vh] grid-cols-[60vw_40vw]">
            <div class=" col-span-2 flex">
                <div class="flex-2 flex justify-center items-center text-white">
                    <p class="text-4xl">SmartWatch</p>
                </div>
                <div class="flex-4 flex justify-center items-center gap-x-20 text-white text-xl">
                    <p>HOME</p>
                    <p>ABOUT</p>
                    <p>SHOP</p>
                    <p>CONTACT</p>
                </div>
                <div class="flex-2 flex items-center justify-center gap-x-10 text-white text-3xl">
                    <ion-icon name="search"></ion-icon>
                    <ion-icon name="bag-handle"></ion-icon>
                </div>
            </div>
            <div class="flex flex-col justify-center items-center gap-y-10">

                <div class="w-[80%] h-[30%] text-white font-bold flex flex-col justify-center gap-y-4">
                    <p class="text-6xl">Quality Time</p>
                    <p class="text-6xl">Quality Watches</p>
                </div>
                <div class="w-[80%] h-[15%]">
                    <p class="text-3xl text-white">Get the mode that fits the time. This is the best Watches for your time</p>
                </div>
                <div class="w-[80%] h-[10%] flex gap-x-10">
                    <div class="bg-white w-[150px] h-full flex justify-center items-center rounded-xl text-pink-400 font-bold">Read more</div>
                    <div class="bg-white w-[150px] h-full flex justify-center items-center rounded-xl text-pink-400 font-bold">Buy</div>
                </div>

            </div>
            <div>
                <img src="watch.png" width="450"/>
            </div>
            <div class="bg-orange-400 col-span-2"></div>
        </div>
    </body>
</html>
